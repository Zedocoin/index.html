<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zedocoin | The Future is Ours</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        /* Karanlık ve Karizmatik Stil */
        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        h1, h2 {
            font-family: 'Cinzel', serif; /* Mafya estetiği için klasik font */
            letter-spacing: 3px;
            color: #d4af37; /* Altın rengi detaylar */
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
            animation: fadeIn 3s ease-in-out;
        }

        .logo-container {
            border: 2px solid #d4af37;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            transition: transform 0.5s ease;
        }

        .logo-container:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
        }

        .tagline {
            font-style: italic;
            opacity: 0.7;
            font-size: 1.2rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn {
            margin-top: 30px;
            padding: 12px 30px;
            background: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #d4af37;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="hero">
        <div class="logo-container">
            <h1>ZEDOCOIN</h1>
        </div>
        <p class="tagline">"Sadece en güçlüler hayatta kalır."</p>
        
        <div style="margin-top: 50px; max-width: 600px;">
            <h2>TOKENOMICS</h2>
            <p><strong>Arz:</strong> 1,000,000,000 ZEDO</p>
            <p><strong>Ağ:</strong> Binance Smart Chain (BSC)</p>
        </div>

        <a href="#roadmap" class="btn">Yol Haritası</a>
    </div>

</body>
</html>
